<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 مساعدي الذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            background: #1a1a2e;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(212, 168, 83, 0.15);
        }
        .chat-header {
            background: #d4a853;
            color: #1a1a1a;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 { font-size: 24px; margin: 0; }
        .chat-header p { font-size: 14px; opacity: 0.85; margin: 5px 0 0; }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-items: flex-end; }
        .message.ai { align-items: flex-start; }
        .message .bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 15px;
        }
        .message.user .bubble {
            background: #d4a853;
            color: #1a1a1a;
            border-bottom-right-radius: 4px;
        }
        .message.ai .bubble {
            background: rgba(255,255,255,0.08);
            color: #f0ede8;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .message .bubble img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
        }
        .message .bubble .time {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 6px;
            display: block;
            text-align: left;
        }
        .message.user .bubble .time { color: rgba(0,0,0,0.5); text-align: right; }
        .typing-indicator {
            display: none;
            padding: 10px 20px;
            color: #d4a853;
            font-size: 14px;
        }
        .typing-indicator.active { display: block; }
        .chat-input {
            display: flex;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            color: #f0ede8;
        }
        .chat-input input::placeholder { color: rgba(255,255,255,0.3); }
        .chat-input input:focus { border-color: #d4a853; }
        .chat-input button {
            padding: 12px 30px;
            background: #d4a853;
            color: #1a1a1a;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-input button:hover { transform: scale(1.02); }
        .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
        .suggestions {
            display: flex;
            gap: 6px;
            padding: 8px 20px 0;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.15);
        }
        .suggestions button {
            padding: 5px 14px;
            background: rgba(212, 168, 83, 0.1);
            border: 1px solid rgba(212, 168, 83, 0.15);
            border-radius: 20px;
            color: #d4a853;
            font-size: 12px;
            cursor: pointer;
        }
        .suggestions button:hover { background: rgba(212, 168, 83, 0.2); }
        .status-bar {
            padding: 4px 20px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.03);
        }
        .status-bar .online { color: #4ade80; }
        .status-bar .offline { color: #f87171; }
        @media (max-width: 600px) {
            .chat-container { width: 100%; height: 100vh; border-radius: 0; }
            .message .bubble { max-width: 88%; font-size: 14px; padding: 10px 14px; }
            .chat-input { padding: 12px 16px; }
            .chat-input input { font-size: 14px; padding: 10px 14px; }
            .chat-input button { padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 مساعدي الذكي</h1>
            <p>اسألني أي شيء</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="bubble">
                    🌟 مرحباً! أنا مساعدك الذكي. اسألني أي شيء أو اطلب مني صورة!
                    <span class="time">الآن</span>
                </div>
            </div>
        </div>
        <div class="suggestions">
            <button onclick="sendSuggestion('مرحبا')">👋 مرحبا</button>
            <button onclick="sendSuggestion('كيف حالك')">😊 كيف حالك</button>
            <button onclick="sendSuggestion('من أنت')">❓ من أنت</button>
            <button onclick="sendSuggestion('الوقت')">🕒 الوقت</button>
            <button onclick="sendSuggestion('الكتب')">📚 الكتب</button>
            <button onclick="sendSuggestion('أنشئ لي صورة غروب شمس')">🌅 صورة</button>
        </div>
        <div class="typing-indicator" id="typingIndicator">🤖 جاري التفكير...</div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
            <button id="sendButton">إرسال</button>
        </div>
        <div class="status-bar">
            🔗 <span id="aiStatus" class="online">الذكاء الاصطناعي</span>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const aiStatus = document.getElementById('aiStatus');

        function addMessage(text, sender, isImage = false, imageData = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            let content = text.replace(/\n/g, '<br>');
            
            if (isImage && imageData) {
                content += `<br><img src="${imageData}" alt="صورة" style="max-width:300px;border-radius:10px;">`;
            }
            
            content += `<span class="time">${new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}</span>`;
            
            bubble.innerHTML = content;
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendSuggestion(text) {
            userInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            sendButton.disabled = true;
            typingIndicator.classList.add('active');
            aiStatus.textContent = 'جاري التفكير...';
            aiStatus.className = 'offline';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                typingIndicator.classList.remove('active');
                sendButton.disabled = false;
                aiStatus.textContent = '✅ متصل';
                aiStatus.className = 'online';

                if (data.image) {
                    addMessage('🖼️ تم إنشاء الصورة:', 'ai', true, data.image);
                } else if (data.response) {
                    addMessage(data.response, 'ai');
                } else if (data.error) {
                    addMessage('⚠️ ' + data.error, 'ai');
                } else {
                    addMessage('آسف، ما فهمت سؤالك.', 'ai');
                }
            } catch (error) {
                typingIndicator.classList.remove('active');
                sendButton.disabled = false;
                aiStatus.textContent = '⚠️ غير متصل';
                aiStatus.className = 'offline';
                addMessage('⚠️ لا يمكن الاتصال بالخادم.', 'ai');
                console.error('Error:', error);
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        sendButton.addEventListener('click', sendMessage);
        userInput.focus();
    </script>
</body>
</html>
