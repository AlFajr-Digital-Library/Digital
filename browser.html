<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصفح سِفْر</title>
    
    <!-- ===== Font Awesome 6 (مجاني) ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ===== إعادة تعيين كاملة ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a12;
        }

        /* ===== المتصفح ===== */
        .browser {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0d0d1a;
            overflow: hidden;
            transition: all 0.3s;
        }

        /* ===== شريط التبويبات (أعلى) ===== */
        .tabs-bar {
            background: #0a0a14;
            padding: 6px 10px 0 10px;
            display: flex;
            align-items: center;
            gap: 3px;
            border-bottom: 2px solid #1a1a35;
            min-height: 46px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            scrollbar-width: thin;
            scrollbar-color: #2a2a55 transparent;
            direction: rtl;
        }

        .tabs-bar::-webkit-scrollbar {
            height: 3px;
        }
        .tabs-bar::-webkit-scrollbar-thumb {
            background: #2a2a55;
            border-radius: 10px;
        }

        /* ===== التبويب ===== */
        .tab {
            background: #12122a;
            padding: 5px 12px;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #7777aa;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            border-bottom: none;
            white-space: nowrap;
            min-width: 120px;
            max-width: 200px;
            height: 36px;
            flex-shrink: 0;
            position: relative;
        }

        .tab:hover {
            background: #1e1e42;
            color: #ccccff;
            transform: translateY(-2px);
        }

        .tab.active {
            background: #1a1a3a;
            border-color: #4a4a8a;
            color: #ffffff;
            box-shadow: 0 -4px 25px rgba(70, 70, 200, 0.15);
        }

        .tab .tab-icon {
            font-size: 14px;
            opacity: 0.7;
        }

        .tab .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            font-weight: 500;
            letter-spacing: 0.2px;
            font-size: 12px;
        }

        .tab .tab-close {
            background: transparent;
            border: none;
            color: #444477;
            font-size: 14px;
            cursor: pointer;
            padding: 0 3px;
            border-radius: 50%;
            transition: all 0.2s;
            line-height: 1;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            order: -1;
        }

        .tab .tab-close:hover {
            background: #ff3b3b;
            color: white;
            transform: scale(1.2);
        }

        /* ===== زر + ===== */
        .add-tab {
            background: transparent;
            border: none;
            color: #3a3a66;
            font-size: 18px;
            cursor: pointer;
            padding: 0 14px;
            transition: all 0.3s;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 6px;
            order: 999;
        }

        .add-tab:hover {
            background: #1a1a3a;
            color: #8888cc;
            transform: rotate(90deg) scale(1.1);
        }

        /* ===== شريط الأدوات (تحت التبويبات مباشرة مثل Edge) ===== */
        .toolbar {
            background: #0d0d22;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #1a1a35;
            flex-shrink: 0;
            min-height: 44px;
        }

        .toolbar .nav-btn {
            background: transparent;
            border: none;
            color: #555588;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
        }

        .toolbar .nav-btn:hover {
            background: #1a1a3a;
            color: #aaaadd;
            transform: scale(1.05);
        }

        .toolbar .nav-btn:active {
            transform: scale(0.95);
        }

        /* ===== الشعار (بدون نص) ===== */
        .brand-logo {
            display: flex;
            align-items: center;
            padding: 0 6px;
            flex-shrink: 0;
            cursor: default;
        }

        .brand-logo .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: linear-gradient(135deg, #5a5aff, #8a6aff);
            color: white;
            box-shadow: 0 0 20px rgba(70, 70, 255, 0.2);
            flex-shrink: 0;
        }

        /* ===== شريط البحث ===== */
        .search-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #080816;
            border: 1px solid #1a1a35;
            border-radius: 25px;
            padding: 0 16px;
            transition: all 0.3s;
            height: 34px;
            min-width: 100px;
        }

        .search-container:focus-within {
            border-color: #4a4a8a;
            box-shadow: 0 0 30px rgba(70, 70, 200, 0.08);
            background: #0a0a1a;
        }

        .search-container .search-icon {
            color: #3a3a66;
            font-size: 14px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .search-container .url-bar {
            flex: 1;
            background: transparent;
            border: none;
            color: #c0c0ee;
            font-size: 13.5px;
            outline: none;
            height: 100%;
            padding: 0 4px;
            min-width: 50px;
        }

        .search-container .url-bar::placeholder {
            color: #333355;
            font-weight: 300;
        }

        .search-container .go-btn {
            background: linear-gradient(135deg, #3a3a7a, #2a2a5a);
            border: none;
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container .go-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(70, 70, 200, 0.2);
            background: linear-gradient(135deg, #4a4a9a, #3a3a7a);
        }

        /* ===== أزرار إضافية ===== */
        .extra-buttons {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            padding: 0 4px;
            border-right: 1px solid #1a1a35;
            margin-right: 4px;
            padding-right: 8px;
        }

        .extra-buttons .tool-btn {
            background: transparent;
            border: none;
            color: #444477;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .extra-buttons .tool-btn:hover {
            background: #1a1a3a;
            color: #aaaadd;
            transform: scale(1.1);
        }

        /* ===== مشغل التطبيقات ===== */
        .apps-launcher {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            padding: 0 4px;
            border-right: 1px solid #1a1a35;
            margin-right: 4px;
            padding-right: 8px;
        }

        .apps-launcher .app-btn {
            background: transparent;
            border: none;
            color: #444477;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .apps-launcher .app-btn:hover {
            background: #1a1a3a;
            color: #aaaadd;
            transform: scale(1.1);
        }

        /* ===== قائمة التطبيقات ===== */
        .apps-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #12122a;
            border: 1px solid #1a1a35;
            border-radius: 12px;
            padding: 12px;
            min-width: 280px;
            max-width: 350px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            z-index: 1000;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .apps-dropdown.show {
            display: grid;
        }

        .apps-dropdown .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: #8888bb;
            font-size: 10px;
        }

        .apps-dropdown .app-item:hover {
            background: #1a1a3a;
            transform: scale(1.05);
        }

        .apps-dropdown .app-item .app-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #1a1a35;
            color: #8888cc;
        }

        .apps-dropdown .app-item span {
            font-size: 10px;
            color: #7777aa;
        }

        /* ===== محتوى الصفحات ===== */
        .content-area {
            flex: 1;
            background: #0a0a12;
            position: relative;
            overflow: hidden;
        }

        .tab-panel {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            right: 0;
        }

        .tab-panel.active {
            display: block;
        }

        .tab-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* ===== صفحة الترحيب ===== */
        .welcome-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: radial-gradient(ellipse at center, #12122a, #080812);
            color: #8888bb;
            padding: 40px;
            gap: 16px;
        }

        .welcome-page .logo-big {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            background: linear-gradient(135deg, #5a5aff, #8a6aff);
            color: white;
            box-shadow: 0 0 60px rgba(70, 70, 255, 0.15);
            margin-bottom: 8px;
        }

        .welcome-page .logo-text-big {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #6a6aff, #aa88ff, #6a6aff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            letter-spacing: 10px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .welcome-page .sub {
            font-size: 16px;
            color: #555588;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .welcome-page .hint {
            font-size: 13px;
            color: #333355;
            margin-top: 20px;
            border-top: 1px solid #222244;
            padding-top: 20px;
            letter-spacing: 1px;
        }

        .welcome-page .hint code {
            background: #1a1a33;
            padding: 4px 12px;
            border-radius: 12px;
            color: #8888cc;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* ===== سكرول ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a15;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a55;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a7a;
        }

        /* ===== شاشات صغيرة ===== */
        @media (max-width: 700px) {
            .tab {
                min-width: 70px;
                font-size: 10px;
                padding: 4px 8px;
                height: 30px;
            }
            .add-tab {
                font-size: 16px;
                padding: 0 8px;
            }
            .search-container .url-bar {
                font-size: 11px;
            }
            .search-container .go-btn {
                font-size: 10px;
                padding: 3px 10px;
                height: 24px;
            }
            .brand-logo .logo-icon {
                width: 26px;
                height: 26px;
                font-size: 14px;
            }
            .welcome-page .logo-text-big {
                font-size: 48px;
                letter-spacing: 6px;
            }
            .apps-dropdown {
                min-width: 200px;
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ===== Toast notification ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a3a;
            color: #aaaadd;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #2a2a55;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            font-size: 14px;
            display: none;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .toast.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="browser" id="browser">
    <!-- ===== شريط التبويبات ===== -->
    <div class="tabs-bar" id="tabsBar">
        <button class="add-tab" id="addTabBtn" title="تبويب جديد">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- ===== شريط الأدوات (تحت التبويبات مباشرة مثل Edge) ===== -->
    <div class="toolbar">
        <!-- أزرار التنقل -->
        <button class="nav-btn" id="backBtn" title="رجوع">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="nav-btn" id="forwardBtn" title="تقدم">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="nav-btn" id="refreshBtn" title="تحديث">
            <i class="fas fa-sync-alt"></i>
        </button>

        <!-- ===== الشعار (بدون نص) ===== -->
        <div class="brand-logo">
            <div class="logo-icon">
                <i class="fas fa-compass"></i>
            </div>
        </div>

        <!-- ===== شريط البحث ===== -->
        <div class="search-container">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" class="url-bar" id="urlBar" placeholder="ابحث أو اكتب رابطاً..." spellcheck="false" autocomplete="off" dir="rtl">
            <button class="go-btn" id="goBtn">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>

        <!-- ===== أزرار إضافية ===== -->
        <div class="extra-buttons">
            <button class="tool-btn" id="fullscreenBtn" title="ملء الشاشة">
                <i class="fas fa-expand"></i>
            </button>
            <button class="tool-btn" id="homeBtn" title="الصفحة الرئيسية">
                <i class="fas fa-home"></i>
            </button>
        </div>

        <!-- ===== مشغل التطبيقات ===== -->
        <div class="apps-launcher">
            <button class="app-btn" id="appsToggle" title="التطبيقات">
                <i class="fas fa-th"></i>
            </button>
        </div>

        <!-- ===== قائمة التطبيقات ===== -->
        <div class="apps-dropdown" id="appsDropdown">
            <button class="app-item" data-url="https://www.google.com">
                <div class="app-icon" style="background: #4285F4;"><i class="fab fa-google"></i></div>
                <span>جوجل</span>
            </button>
            <button class="app-item" data-url="https://www.youtube.com">
                <div class="app-icon" style="background: #FF0000;"><i class="fab fa-youtube"></i></div>
                <span>يوتيوب</span>
            </button>
            <button class="app-item" data-url="https://github.com">
                <div class="app-icon" style="background: #181717;"><i class="fab fa-github"></i></div>
                <span>جيت هاب</span>
            </button>
            <button class="app-item" data-url="https://www.wikipedia.org">
                <div class="app-icon" style="background: #000000;"><i class="fab fa-wikipedia-w"></i></div>
                <span>ويكيبيديا</span>
            </button>
            <button class="app-item" data-url="https://www.reddit.com">
                <div class="app-icon" style="background: #FF4500;"><i class="fab fa-reddit-alien"></i></div>
                <span>ريديت</span>
            </button>
            <button class="app-item" data-url="https://twitter.com">
                <div class="app-icon" style="background: #1DA1F2;"><i class="fab fa-twitter"></i></div>
                <span>تويتر</span>
            </button>
            <button class="app-item" data-url="https://www.instagram.com">
                <div class="app-icon" style="background: #E4405F;"><i class="fab fa-instagram"></i></div>
                <span>انستغرام</span>
            </button>
            <button class="app-item" data-url="https://www.netflix.com">
                <div class="app-icon" style="background: #E50914;"><i class="fas fa-film"></i></div>
                <span>نتفليكس</span>
            </button>
        </div>
    </div>

    <!-- ===== محتوى الصفحات ===== -->
    <div class="content-area" id="contentArea"></div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        'use strict';

        // =============================================
        //  🔐 الأكواد السرية المخفية
        // =============================================
        const SECRET_CODES = {
            'سفر': 'https://example.com',
            'hack': 'https://github.com',
            'dark': 'https://duckduckgo.com',
            'open': 'https://wikipedia.org',
            'book': 'https://archive.org',
            '2026': 'https://stackoverflow.com',
            'secret': 'https://www.google.com/webhp?igu=1'
        };

        const DEFAULT_PAGE = 'about:blank';

        // =============================================
        //  المتغيرات الأساسية
        // =============================================
        let tabs = [];
        let tabIdCounter = 0;
        let activeTabId = null;
        let isFullscreen = false;

        const browser = document.getElementById('browser');
        const tabsBar = document.getElementById('tabsBar');
        const contentArea = document.getElementById('contentArea');
        const urlBar = document.getElementById('urlBar');
        const goBtn = document.getElementById('goBtn');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const addTabBtn = document.getElementById('addTabBtn');
        const homeBtn = document.getElementById('homeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const appsToggle = document.getElementById('appsToggle');
        const appsDropdown = document.getElementById('appsDropdown');
        const toast = document.getElementById('toast');

        // =============================================
        //  Toast Notification
        // =============================================
        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // =============================================
        //  الدوال الأساسية
        // =============================================

        function generateId() {
            return ++tabIdCounter;
        }

        // إنشاء تبويب جديد
        function createTab(title = 'تبويب جديد', url = DEFAULT_PAGE, activate = true) {
            const id = generateId();
            const tab = {
                id: id,
                title: title,
                url: url,
                active: false
            };
            tabs.push(tab);

            renderTabElement(tab);
            renderTabPanel(tab);

            if (activate) {
                activateTab(id);
            }

            updateUrlBar();
            return tab;
        }

        // رسم التبويب
        function renderTabElement(tab) {
            const tabDiv = document.createElement('div');
            tabDiv.className = 'tab';
            tabDiv.dataset.tabId = tab.id;
            tabDiv.id = `tab-${tab.id}`;

            const icon = tab.url !== 'about:blank' ? '🌐' : '🏠';

            tabDiv.innerHTML = `
                <span class="tab-icon">${icon}</span>
                <span class="tab-title">${tab.title}</span>
                <button class="tab-close" data-tab-id="${tab.id}">
                    <i class="fas fa-times"></i>
                </button>
            `;

            tabsBar.insertBefore(tabDiv, addTabBtn);

            tabDiv.addEventListener('click', function(e) {
                if (e.target.closest('.tab-close')) return;
                activateTab(tab.id);
            });

            const closeBtn = tabDiv.querySelector('.tab-close');
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeTab(tab.id);
            });

            if (tab.active) {
                tabDiv.classList.add('active');
            }
        }

        // رسم لوحة التبويب
        function renderTabPanel(tab) {
            const panel = document.createElement('div');
            panel.className = 'tab-panel';
            panel.id = `panel-${tab.id}`;
            panel.dataset.tabId = tab.id;

            if (tab.url === 'about:blank') {
                panel.innerHTML = `
                    <div class="welcome-page">
                        <div class="logo-big">
                            <i class="fas fa-compass"></i>
                        </div>
                        <div class="logo-text-big">سِفْر</div>
                        <div class="sub">متصفح الأمان والسرعة</div>
                        <div class="hint">
                            ✦ اكتب رابطاً أو <code>كوداً سرياً</code> في شريط البحث ✦
                        </div>
                    </div>
                `;
            } else {
                const iframe = document.createElement('iframe');
                iframe.src = tab.url;
                iframe.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
                iframe.sandbox = 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals';
                panel.appendChild(iframe);
            }

            contentArea.appendChild(panel);

            if (tab.active) {
                panel.classList.add('active');
            }
        }

        // تفعيل تبويب
        function activateTab(id) {
            tabs.forEach(t => t.active = false);
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));

            const tab = tabs.find(t => t.id === id);
            if (!tab) return;

            tab.active = true;
            activeTabId = id;

            const tabEl = document.getElementById(`tab-${id}`);
            if (tabEl) tabEl.classList.add('active');

            const panelEl = document.getElementById(`panel-${id}`);
            if (panelEl) panelEl.classList.add('active');

            updateUrlBar();
            document.title = tab.title + ' - سِفْر';
        }

        // إغلاق تبويب
        function closeTab(id) {
            if (tabs.length <= 1) {
                showToast('⚠️ لا يمكن إغلاق آخر تبويب');
                return;
            }

            const index = tabs.findIndex(t => t.id === id);
            if (index === -1) return;

            const wasActive = tabs[index].active;

            const tabEl = document.getElementById(`tab-${id}`);
            if (tabEl) tabEl.remove();

            const panelEl = document.getElementById(`panel-${id}`);
            if (panelEl) panelEl.remove();

            tabs.splice(index, 1);

            if (wasActive) {
                const newActive = tabs[0] || null;
                if (newActive) {
                    activateTab(newActive.id);
                }
            }
        }

        // تحديث شريط البحث
        function updateUrlBar() {
            const activeTab = tabs.find(t => t.active);
            if (activeTab) {
                urlBar.value = activeTab.url !== 'about:blank' ? activeTab.url : '';
            }
        }

        // تحديث عنوان التبويب
        function updateTabTitle(id, newTitle) {
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;
            tab.title = newTitle;
            const titleSpan = document.querySelector(`#tab-${id} .tab-title`);
            if (titleSpan) titleSpan.textContent = newTitle;
            if (tab.active) {
                document.title = newTitle + ' - سِفْر';
            }
        }

        // =============================================
        //  الوظيفة الرئيسية: الذهاب إلى رابط
        // =============================================
        function goToUrl(input) {
            let text = input.trim();

            // 1. التحقق من الأكواد السرية
            if (SECRET_CODES[text.toLowerCase()]) {
                const secretUrl = SECRET_CODES[text.toLowerCase()];
                const newTab = createTab('🔐 سري', secretUrl, true);
                activateTab(newTab.id);
                urlBar.value = secretUrl;
                showToast('✅ تم فتح التبويب السري');
                return;
            }

            // 2. إذا كان الرابط فارغاً => صفحة الترحيب
            if (text === '') {
                const activeTab = tabs.find(t => t.active);
                if (activeTab) {
                    activeTab.url = DEFAULT_PAGE;
                    activeTab.title = 'الصفحة الرئيسية';
                    const panel = document.getElementById(`panel-${activeTab.id}`);
                    if (panel) {
                        panel.innerHTML = `
                            <div class="welcome-page">
                                <div class="logo-big">
                                    <i class="fas fa-compass"></i>
                                </div>
                                <div class="logo-text-big">سِفْر</div>
                                <div class="sub">متصفح الأمان والسرعة</div>
                                <div class="hint">✦ اكتب رابطاً أو كوداً سرياً في شريط البحث ✦</div>
                            </div>
                        `;
                    }
                    updateTabTitle(activeTab.id, 'الصفحة الرئيسية');
                    updateUrlBar();
                }
                return;
            }

            // 3. رابط عادي
            let finalUrl = text;
            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                if (finalUrl.includes('.') && !finalUrl.includes(' ')) {
                    finalUrl = 'https://' + finalUrl;
                } else {
                    finalUrl = 'https://www.google.com/search?q=' + encodeURIComponent(text);
                }
            }

            const activeTab = tabs.find(t => t.active);
            if (!activeTab) return;

            activeTab.url = finalUrl;
            const panel = document.getElementById(`panel-${activeTab.id}`);
            if (panel) {
                panel.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.src = finalUrl;
                iframe.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
                iframe.sandbox = 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals';
                panel.appendChild(iframe);
            }

            let title = finalUrl.replace(/^https?:\/\//, '').split('/')[0];
            if (title.length > 25) title = title.substring(0, 22) + '...';
            updateTabTitle(activeTab.id, title || 'موقع');
            updateUrlBar();
        }

        // =============================================
        //  🔄 خاصية ملء الشاشة
        // =============================================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast('⚠️ لا يمكن الدخول إلى وضع ملء الشاشة');
                });
                isFullscreen = true;
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                fullscreenBtn.classList.add('active');
                showToast('⛶ وضع ملء الشاشة');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    isFullscreen = false;
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                    fullscreenBtn.classList.remove('active');
                    showToast('⛶ الخروج من ملء الشاشة');
                }
            }
        }

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                isFullscreen = false;
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                fullscreenBtn.classList.remove('active');
            }
        });

        // =============================================
        //  الأحداث
        // =============================================

        goBtn.addEventListener('click', function() {
            goToUrl(urlBar.value);
        });

        urlBar.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                goToUrl(urlBar.value);
            }
        });

        addTabBtn.addEventListener('click', function() {
            const newTab = createTab('تبويب جديد', DEFAULT_PAGE, true);
            activateTab(newTab.id);
            urlBar.value = '';
            const tabEl = document.getElementById(`tab-${newTab.id}`);
            if (tabEl) {
                tabEl.style.transform = 'scale(1.1)';
                setTimeout(() => tabEl.style.transform = 'scale(1)', 200);
            }
            showToast('📄 تبويب جديد');
        });

        homeBtn.addEventListener('click', function() {
            const activeTab = tabs.find(t => t.active);
            if (activeTab) {
                activeTab.url = DEFAULT_PAGE;
                activeTab.title = 'الصفحة الرئيسية';
                const panel = document.getElementById(`panel-${activeTab.id}`);
                if (panel) {
                    panel.innerHTML = `
                        <div class="welcome-page">
                            <div class="logo-big">
                                <i class="fas fa-compass"></i>
                            </div>
                            <div class="logo-text-big">سِفْر</div>
                            <div class="sub">متصفح الأمان والسرعة</div>
                            <div class="hint">✦ اكتب رابطاً أو كوداً سرياً في شريط البحث ✦</div>
                        </div>
                    `;
                }
                updateTabTitle(activeTab.id, 'الصفحة الرئيسية');
                updateUrlBar();
                showToast('🏠 العودة للصفحة الرئيسية');
            }
        });

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        backBtn.addEventListener('click', function() {
            const activeTab = tabs.find(t => t.active);
            if (!activeTab || activeTab.url === 'about:blank') return;
            const panel = document.getElementById(`panel-${activeTab.id}`);
            if (panel) {
                const iframe = panel.querySelector('iframe');
                if (iframe) {
                    try {
                        iframe.contentWindow.history.back();
                    } catch(e) {}
                }
            }
        });

        forwardBtn.addEventListener('click', function() {
            const activeTab = tabs.find(t => t.active);
            if (!activeTab || activeTab.url === 'about:blank') return;
            const panel = document.getElementById(`panel-${activeTab.id}`);
            if (panel) {
                const iframe = panel.querySelector('iframe');
                if (iframe) {
                    try {
                        iframe.contentWindow.history.forward();
                    } catch(e) {}
                }
            }
        });

        refreshBtn.addEventListener('click', function() {
            const activeTab = tabs.find(t => t.active);
            if (!activeTab || activeTab.url === 'about:blank') return;
            const panel = document.getElementById(`panel-${activeTab.id}`);
            if (panel) {
                const iframe = panel.querySelector('iframe');
                if (iframe) {
                    iframe.src = iframe.src;
                    showToast('🔄 تم التحديث');
                }
            }
        });

        // ===== مشغل التطبيقات =====
        appsToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            appsDropdown.classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
            if (!appsDropdown.contains(e.target) && e.target !== appsToggle && !appsToggle.contains(e.target)) {
                appsDropdown.classList.remove('show');
            }
        });

        document.querySelectorAll('.app-item').forEach(btn => {
            btn.addEventListener('click', function() {
                const url = this.dataset.url;
                if (url) {
                    const newTab = createTab('📱 تطبيق', url, true);
                    activateTab(newTab.id);
                    urlBar.value = url;
                    appsDropdown.classList.remove('show');
                    showToast('📱 تم فتح التطبيق');
                }
            });
        });

        // =============================================
        //  🕵️ اختصارات لوحة المفاتيح
        // =============================================

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 't' || e.key === 'T')) {
                e.preventDefault();
                addTabBtn.click();
            }

            if (e.ctrlKey && (e.key === 'w' || e.key === 'W')) {
                e.preventDefault();
                const activeTab = tabs.find(t => t.active);
                if (activeTab) {
                    closeTab(activeTab.id);
                }
            }

            if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
                e.preventDefault();
                urlBar.focus();
                urlBar.select();
            }

            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }

            if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) {
                e.preventDefault();
                const secretTab = createTab('🔐 سري', 'https://example.com', true);
                activateTab(secretTab.id);
                urlBar.value = 'https://example.com';
                showToast('🔐 تم فتح تبويب سري');
            }

            if (e.key === 'Escape') {
                appsDropdown.classList.remove('show');
            }
        });

        // =============================================
        //  بدء التشغيل
        // =============================================

        createTab('الصفحة الرئيسية', DEFAULT_PAGE, true);
        urlBar.value = '';

        console.log('📖 متصفح سِفْر جاهز!');
        console.log('🔐 الأكواد السرية:');
        Object.keys(SECRET_CODES).forEach(key => {
            console.log(`   ➜ "${key}" => ${SECRET_CODES[key]}`);
        });
        console.log('⌨️  الاختصارات:');
        console.log('   ➜ Ctrl+T = تبويب جديد');
        console.log('   ➜ Ctrl+W = إغلاق تبويب');
        console.log('   ➜ Ctrl+L = التركيز على شريط البحث');
        console.log('   ➜ F11 = ملء الشاشة');
        console.log('   ➜ Ctrl+Shift+S = تبويب سري');

    })();
</script>

</body>
</html>
