<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUDORA - Gaming Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c0f1d;
      --card-bg: #141829;
      --border-color: #212840;
      --primary-purple: #7952e9;
      --accent-cyan: #00f2fe;
      --accent-pink: #ff2a8d;
      --text-muted: #838eab;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
    }

    .dashboard-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background-color: #101322;
      border-left: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-title {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .friend-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrap {
      position: relative;
      width: 38px;
      height: 38px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #2a314d;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid #101322;
    }

    .friend-info .name {
      font-size: 14px;
      font-weight: 600;
    }

    .friend-info .status {
      font-size: 11px;
      color: var(--text-muted);
    }

    .quick-chat-btn {
      margin-top: auto;
      background: #191e33;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
    }

    .main-content {
      flex: 1;
      padding: 25px 35px;
      overflow-y: auto;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-menu {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding-bottom: 6px;
      transition: 0.2s;
    }

    .nav-menu a.active, .nav-menu a:hover {
      color: #fff;
      border-bottom: 3px solid var(--primary-purple);
    }

    .profile-banner {
      background: linear-gradient(135deg, #171c32 0%, #101322 100%);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .user-details {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #38305c;
      border: 2px solid var(--primary-purple);
    }

    .status-badge {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .section-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-thumb {
      height: 220px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .card-body {
      padding: 15px;
      text-align: center;
    }

    .game-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .progress-container {
      background: #0c0f1d;
      height: 5px;
      border-radius: 3px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent-cyan);
    }

    .progress-bar.pink {
      background: var(--accent-pink);
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(90deg, #3a7bd5, #3a6073);
    }

    .action-btn.purple {
      background: linear-gradient(90deg, #6a11cb, #2575fc);
    }

    @media (max-width: 992px) {
      .sidebar {
        display: none;
      }
      .main-content {
        padding: 20px;
      }
    }

    @media (max-width: 680px) {
      .navbar {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .nav-menu {
        width: 100%;
        justify-content: space-between;
        font-size: 13px;
      }

      .profile-banner {
        flex-direction: column;
        align-items: flex-start;
      }

      .games-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }

      .card-thumb {
        height: 160px;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <aside class="sidebar">
      <div class="sidebar-title">أصدقاء أونلاين</div>
      <div class="friend-list">
        <div class="friend-item">
          <div class="avatar-wrap">
            <div class="avatar"></div>
            <div class="status-dot"></div>
          </div>
          <div class="friend-info">
            <div class="name">أحمد</div>
            <div class="status">متاح الآن</div>
          </div>
        </div>
        <div class="friend-item">
          <div class="avatar-wrap">
            <div class="avatar"></div>
            <div class="status-dot"></div>
          </div>
          <div class="friend-info">
            <div class="name">سلمان</div>
            <div class="status">يلعب الآن</div>
          </div>
        </div>
        <div class="friend-item">
          <div class="avatar-wrap">
            <div class="avatar"></div>
            <div class="status-dot"></div>
          </div>
          <div class="friend-info">
            <div class="name">نورة</div>
            <div class="status">متاحة</div>
          </div>
        </div>
      </div>
      <button class="quick-chat-btn">💬 دردشة سريعة</button>
    </aside>

    <main class="main-content">
      
      <nav class="navbar">
        <div class="brand-logo">🎮 LUDORA</div>
        <ul class="nav-menu">
          <li><a href="#" class="active">الرئيسية</a></li>
          <li><a href="#">الساحة</a></li>
          <li><a href="#">المتجر</a></li>
          <li><a href="#">المجتمع</a></li>
          <li><a href="#">البروفايل</a></li>
        </ul>
      </nav>

      <div class="profile-banner">
        <div class="user-details">
          <div class="user-avatar"></div>
          <div>
            <h3>🎮 ماجد الغامدي</h3>
            <span style="color: var(--text-muted); font-size: 13px;">المستوى: 25</span>
          </div>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;">
          <span style="font-size: 14px;">نقاط الخبرة: <b>4500 XP</b></span>
          <span class="status-badge"><span style="font-size:8px;">●</span> متصل حالياً</span>
        </div>
      </div>

      <div class="section-header">مكتبة ألعابك</div>
      <div class="games-grid">
        
        <div class="game-card">
          <div class="card-thumb" style="background-image: url('https://via.placeholder.com/200x250/1e293b/ffffff?text=Desert+Legend');"></div>
          <div class="card-body">
            <div class="game-title">أسطورة الصحراء</div>
            <div class="progress-container"><div class="progress-bar" style="width: 70%;"></div></div>
            <button class="action-btn purple">ابدأ اللعب</button>
          </div>
        </div>

        <div class="game-card">
          <div class="card-thumb" style="background-image: url('https://via.placeholder.com/200x250/0f172a/ffffff?text=Star+Wars');"></div>
          <div class="card-body">
            <div class="game-title">حرب النجوم</div>
            <div class="progress-container"><div class="progress-bar pink" style="width: 45%;"></div></div>
            <button class="action-btn purple">ابدأ اللعب</button>
          </div>
        </div>

        <div class="game-card">
          <div class="card-thumb" style="background-image: url('https://via.placeholder.com/200x250/311b92/ffffff?text=Galaxy+War');"></div>
          <div class="card-body">
            <div class="game-title">حرب المجرتين</div>
            <div class="progress-container"><div class="progress-bar" style="width: 85%;"></div></div>
            <button class="action-btn purple">ابدأ اللعب</button>
          </div>
        </div>

        <div class="game-card">
          <div class="card-thumb" style="background-image: url('https://via.placeholder.com/200x250/880e4f/ffffff?text=Star+Wars+2');"></div>
          <div class="card-body">
            <div class="game-title">حرب النجوم 2</div>
            <div class="progress-container"><div class="progress-bar pink" style="width: 30%;"></div></div>
            <button class="action-btn purple">ابدأ اللعب</button>
          </div>
        </div>

      </div>

    </main>

  </div>

</body>
</html>
